<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="anyAIlive icon">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset=".55" stop-color="#101636"/>
      <stop offset="1" stop-color="#1a1040"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset=".5" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#e879f9"/>
    </linearGradient>
    <linearGradient id="wave2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#f0abfc"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- rounded app-tile background -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="#818cf8" stroke-opacity=".25" stroke-width="3"/>

  <!-- soft ambient blobs -->
  <circle cx="128" cy="392" r="150" fill="#312e81" opacity=".35"/>
  <circle cx="400" cy="120" r="130" fill="#4c1d95" opacity=".30"/>

  <!-- AI spark, top-right -->
  <g filter="url(#glow)">
    <path d="M382 96l11 30 30 11-30 11-11 30-11-30-30-11 30-11z" fill="url(#wave2)"/>
  </g>
  <path d="M322 168l6 16 16 6-16 6-6 16-6-16-16-6 16-6z" fill="#a5b4fc" opacity=".8"/>

  <!-- voice waveform: 5 rounded bars, center tallest -->
  <g filter="url(#glow)">
    <rect x="112" y="222" width="40" height="68"  rx="20" fill="url(#wave)" opacity=".85"/>
    <rect x="172" y="170" width="40" height="172" rx="20" fill="url(#wave)" opacity=".95"/>
    <rect x="232" y="118" width="40" height="276" rx="20" fill="url(#wave)"/>
    <rect x="292" y="176" width="40" height="160" rx="20" fill="url(#wave)" opacity=".95"/>
    <rect x="352" y="230" width="40" height="52"  rx="20" fill="url(#wave)" opacity=".85"/>
  </g>

  <!-- baseline: voice → reply, a subtle listening arc -->
  <path d="M96 416c48 26 272 26 320 0" fill="none" stroke="url(#wave2)" stroke-width="10" stroke-linecap="round" opacity=".7"/>
</svg>
